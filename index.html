<body>

<p>問題文: ある整数Aが与えられるので、その2倍を出力してください。</p>

<textarea id="code" rows="5" cols="50">// ここに JavaScript コードを記述</textarea>

<button onclick="submitCode('1','A',document.getElementById('code').value)">提出</button>
